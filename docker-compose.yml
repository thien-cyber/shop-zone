version: '3.8'

services:
  #-----------------------------------------------------------
  # 1. DATABASE: PostgreSQL (Chứa dữ liệu ACID Core)
  #-----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: shopzone_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Tự động chạy file schema v3.0 của bạn khi container khởi tạo lần đầu
      - ./infra/postgres:/docker-entrypoint-initdb.d
    networks:
      - shopzone_network

  #-----------------------------------------------------------
  # 2. CACHE & LOCK: Redis (Chứa Session, OTP, Caching & Redlock)
  #-----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: shopzone_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - shopzone_network

  #-----------------------------------------------------------
  # 3. MESSAGE QUEUE: RabbitMQ (Hàng đợi Mail, Webhook)
  #-----------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: shopzone_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"          # Cổng giao tiếp AMQP cho NestJS
      - "${RABBITMQ_MANAGEMENT_PORT}:15672" # Giao diện Web quản trị hàng đợi
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - shopzone_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  shopzone_network:
    driver: bridge